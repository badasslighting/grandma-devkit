name: Publish to Open VSX and VS Code Marketplace

on:
  push:
    tags: ['v*']
  # Run by hand to put an already tagged release on the Marketplace only (Open VSX refuses a version twice):
  #   gh workflow run publish.yml -f tag=v0.4.4 -f marketplace_only=true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.4.4'
        required: true
      marketplace_only:
        description: 'Skip Open VSX (the tag is already there)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          tag="${{ inputs.tag || github.ref_name }}"
          test "v$v" = "$tag" || { echo "Tag $tag does not match package.json version $v"; exit 1; }
      - run: npm test
      - run: npx --yes @vscode/vsce package
      - name: Publish to Open VSX
        if: ${{ !inputs.marketplace_only }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish ./*.vsix -p "$OVSX_PAT"
      # Marketplace, preferred: Trusted Publishing. No stored token: Marketplace trusts this workflow through a policy
      # on the publisher's Trusted Publishing page (owner badasslighting, repo grandma-devkit, workflow publish.yml).
      # Until that policy exists the step fails without failing the release (Open VSX has already published above).
      - name: Publish to VS Code Marketplace (Trusted Publishing)
        if: env.VSCE_PAT == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true
        run: npx --yes @vscode/vsce publish --packagePath ./*.vsix --oidc
      # Marketplace with a token, only while a VSCE_PAT secret is set. Global PATs are retired on 2026-12-01.
      - name: Publish to VS Code Marketplace (PAT)
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
