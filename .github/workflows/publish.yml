name: Publish to Open VSX and VS Code Marketplace

on:
  push:
    tags: ['v*']
  # Run by hand to put an already tagged release on the Marketplace only (Open VSX refuses a version twice):
  #   gh workflow run publish.yml -f tag=v0.4.4 -f marketplace_only=true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.4.4'
        required: true
      marketplace_only:
        description: 'Skip Open VSX (the tag is already there)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Release tooling is pinned to exact versions so that a newly published (possibly compromised) npm release
      # cannot execute in this credentialed job. Bump deliberately and review the changelog when updating.
      VSCE_VERSION: 4.1.0 # 4.x is needed for publish --oidc (Trusted Publishing)
      OVSX_VERSION: 0.10.5
    permissions:
      contents: write # creates the GitHub release and attaches the VSIX
      id-token: write
    # A manual run must itself be dispatched from the default branch (or a tag), so that the workflow definition
    # that holds the publication credentials is not taken from an arbitrary branch.
    if: ${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Release reference must be a version tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "Release reference must be a version tag such as v1.2.3"; exit 1
          fi
      # Only a tag is accepted: a branch of the same name does not resolve under refs/tags/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "Tagged commit is not reachable from $DEFAULT_BRANCH; refusing to publish"; exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag must match package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="$TAG"
          test "v$v" = "$tag" || { echo "Tag $tag does not match package.json version $v"; exit 1; }
      - run: npm test
      - run: npx --yes "@vscode/vsce@${VSCE_VERSION}" package
      - name: GitHub release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The release notes are this version's section of CHANGELOG.md. TAG was checked above to be a plain version tag.
          v="${TAG#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md | sed '1d' > notes.md
          [ -s notes.md ] || echo "grandMA Devkit $v" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.vsix --clobber
          else
            gh release create "$TAG" ./*.vsix --verify-tag --title "grandMA Devkit $v" --notes-file notes.md
          fi
      - name: Publish to Open VSX
        if: ${{ !inputs.marketplace_only }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes "ovsx@${OVSX_VERSION}" publish ./*.vsix -p "$OVSX_PAT"
      # Marketplace, preferred: Trusted Publishing. No stored token: Marketplace trusts this workflow through a policy
      # on the publisher's Trusted Publishing page (owner badasslighting, repo grandma-devkit, workflow publish.yml).
      # Until that policy exists the step fails without failing the release (Open VSX has already published above).
      - name: Publish to VS Code Marketplace (Trusted Publishing)
        if: env.VSCE_PAT == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --packagePath ./*.vsix --oidc
      # Marketplace with a token, only while a VSCE_PAT secret is set. Global PATs are retired on 2026-12-01.
      - name: Publish to VS Code Marketplace (PAT)
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --packagePath ./*.vsix -p "$VSCE_PAT"
